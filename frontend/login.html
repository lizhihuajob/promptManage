<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提示词管理系统 - 登录</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --system-blue: #007AFF;
      --system-blue-hover: #0066CC;
      --system-gray: #8E8E93;
      --system-light-gray: #F2F2F7;
      --system-red: #FF3B30;
      --system-green: #34C759;
      --text-primary: #000000;
      --text-secondary: #8E8E93;
      --border-color: rgba(0, 0, 0, 0.1);
      --shadow-color: rgba(0, 0, 0, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(180deg, #F5F5F7 0%, #E8E8ED 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 48px;
      border-radius: 20px;
      box-shadow: 0 8px 32px var(--shadow-color),
                  0 2px 8px rgba(0, 0, 0, 0.04);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .login-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #007AFF 0%, #5856D6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 4px 20px rgba(0, 122, 255, 0.3);
    }
    .login-icon svg {
      width: 44px;
      height: 44px;
    }
    .login-title {
      text-align: center;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .login-subtitle {
      text-align: center;
      margin-bottom: 40px;
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 400;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 16px 20px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 17px;
      font-weight: 400;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.9);
      color: var(--text-primary);
    }
    .form-group input::placeholder {
      color: var(--system-gray);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--system-blue);
      box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1);
      background: #FFFFFF;
    }
    .login-btn {
      width: 100%;
      padding: 16px;
      background: var(--system-blue);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: -0.2px;
    }
    .login-btn:hover {
      background: var(--system-blue-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
    }
    .login-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(0, 122, 255, 0.2);
    }
    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .error-message {
      background: rgba(255, 59, 48, 0.08);
      border: 1px solid rgba(255, 59, 48, 0.2);
      color: var(--system-red);
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .error-message::before {
      content: '⚠️';
      font-size: 16px;
    }
    .info-box {
      margin-top: 28px;
      padding: 20px 24px;
      background: rgba(0, 122, 255, 0.06);
      border: 1px solid rgba(0, 122, 255, 0.15);
      border-radius: 14px;
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .info-box strong {
      color: var(--system-blue);
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }
    .divider span {
      padding: 0 16px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
    </div>
    <h1 class="login-title">提示词管理</h1>
    <p class="login-subtitle">高效管理您的 AI 提示词</p>
    
    <div id="errorContainer" style="display: none;">
      <div class="error-message" id="errorMessage"></div>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="请输入用户名">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">登录</button>
    </form>
    
    <div class="divider">
      <span>提示</span>
    </div>
    
    <div class="info-box">
      <strong>默认管理员账号</strong>
      用户名：admin<br>
      密码：admin123
    </div>
  </div>

  <script>
    const API_BASE = '';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorContainer = document.getElementById('errorContainer');
      const errorMessage = document.getElementById('errorMessage');
      const loginBtn = document.getElementById('loginBtn');
      
      errorContainer.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const response = await fetch(`${API_BASE}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || '登录失败');
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/dashboard';
      } catch (err) {
        errorMessage.textContent = err.message;
        errorContainer.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('token');
      if (token) {
        window.location.href = '/dashboard';
      }
    });
  </script>
</body>
</html>
